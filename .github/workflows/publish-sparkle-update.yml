name: Publish Sparkle update

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version already uploaded to the updater Blob store (for example, 5.2.9)
        required: true
        type: string
      asset_url:
        description: Exact immutable public Blob URL returned by the updater upload
        required: true
        type: string
      asset_sha256:
        description: SHA-256 of the signed and notarized DMG
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sparkle-production-feed
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish the stable feed
    runs-on: macos-15
    environment: sparkle-release
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      ASSET_URL: ${{ inputs.asset_url }}
      ASSET_SHA256: ${{ inputs.asset_sha256 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Check out the stable branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ASSET_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$ASSET_URL" =~ ^https://[a-z0-9]+\.public\.blob\.vercel-storage\.com/updates/${RELEASE_VERSION}/[a-f0-9]{20}/yaprflow-${RELEASE_VERSION}-[A-Za-z0-9]+\.dmg$ ]]
          [[ -n "$SPARKLE_PRIVATE_KEY" ]]
          [[ -f "release-notes/${RELEASE_VERSION}.md" ]]

      - name: Download the signed and notarized release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sparkle-release
          asset_name="${ASSET_URL##*/}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --output "build/sparkle-release/$asset_name" \
            "$ASSET_URL"
          printf '%s  %s\n' "$ASSET_SHA256" "build/sparkle-release/$asset_name" | shasum -a 256 -c -

      - name: Resolve the pinned Sparkle tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project yaprflow.xcodeproj \
            -scheme yaprflow \
            -clonedSourcePackagesDirPath build/SourcePackages
          test -x build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast
          test -x build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update

      - name: Generate and verify the signed feed
        shell: bash
        run: |
          set -euo pipefail
          asset_name="${ASSET_URL##*/}"
          update_prefix="${ASSET_URL%/*}/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            SPARKLE_ED_KEY_FILE=- \
            SPARKLE_BIN_DIR=build/SourcePackages/artifacts/sparkle/Sparkle/bin \
            SPARKLE_OUTPUT_DIR=build/sparkle-publish \
            SPARKLE_DOWNLOAD_URL_PREFIX="$update_prefix" \
            SPARKLE_RELEASE_NOTES_FILE="release-notes/${RELEASE_VERSION}.md" \
            SPARKLE_EMBED_RELEASE_NOTES=true \
            scripts/prepare-sparkle-update.sh "build/sparkle-release/$asset_name"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update \
              --ed-key-file - --verify build/sparkle-publish/appcast.xml
          cp build/sparkle-publish/appcast.xml checkout/appcast.xml

      - name: Verify the website
        working-directory: checkout
        run: |
          npm ci
          npm test
          npm run build

      - name: Publish the feed source
        shell: bash
        run: |
          set -euo pipefail
          git add checkout/appcast.xml
          git diff --cached --quiet && { echo "The feed did not change." >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Sparkle update v${RELEASE_VERSION}"
          git push origin HEAD:main
